[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brewery-agentic-replanning"
dynamic = ["version"]
description = "Coordinating cross-functional agent assessments for production replanning in a brewery digital twin."
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krzysztof Rewak" }]
keywords = ["digital twin", "multi-agent system", "production replanning", "dynamic scheduling", "brewery"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.dynamic]
version = { attr = "brewery_agentic_replanning.__version__" }

[tool.setuptools.packages.find]
include = ["brewery_agentic_replanning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["brewery_agentic_replanning", "experiments"]

[tool.mypy]
python_version = "3.10"
files = ["brewery_agentic_replanning", "experiments", "tests"]
